  <style>
    @keyframes drawLine {
      from { stroke-dashoffset: 2000; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .card-title {
      font-family: 'Segoe UI', Roboto, Ubuntu, sans-serif;
      font-size: 17px;
      font-weight: 700;
      fill: #F8FAFC;
    }
    .card-subtitle {
      font-family: 'Segoe UI', Roboto, Ubuntu, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #38BDF8;
    }
    .axis-text {
      font-family: 'Segoe UI', Roboto, Ubuntu, sans-serif;
      font-size: 11px;
      font-weight: 500;
      fill: #64748B;
    }
    .chart-line {
      stroke-dasharray: 2000;
      animation: drawLine 2s ease-out forwards;
    }
    .chart-area {
      animation: fadeIn 1.5s ease-out forwards;
    }
  </style>

